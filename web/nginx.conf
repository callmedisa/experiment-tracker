server {
  listen 80;
  server_tokens off;            # do not advertise the nginx version
  error_page 400 =404 /_bad_request;   # server level: a bad URL is rejected before a location is chosen (a named location cannot be used then)
  root /usr/share/nginx/html;
  # The app owns /runs, /keys ... so the API is mounted under /api (prefix stripped). One origin, no CORS.
  # Docker's DNS, re-resolved every 5 s: without this nginx keeps the api container's OLD address after a restart (502s).
  resolver 127.0.0.11 valid=5s ipv6=off;
  # nginx rejects some malformed URLs (invalid %-escapes such as %00) itself, with its own HTML 400 page. For /api that would
  # be distinguishable from the API's uniform JSON 404, so answer those with the same JSON body and headers.
  location = /_bad_request {
    internal;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "Cookie, Authorization" always;
    add_header X-Request-Id $request_id always;
    return 404 '{"code":"not_found","message":"Not found","request_id":"$request_id"}';
  }
  location /api/ {
    set $upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # API runs with TRUSTED_PROXY_HOPS=1
    proxy_set_header Connection "";
    proxy_buffering off;          # SSE
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri /index.html; }
}
